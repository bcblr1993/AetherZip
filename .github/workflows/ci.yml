name: macOS 26 validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify runner and bundled engine
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          sw_vers
          sysctl hw.memsize hw.ncpu
          xcodebuild -version
          shasum -a 256 Resources/7zz
          test "$(lipo -archs Resources/7zz)" = arm64
      - name: Core integration tests
        run: swift test
      - name: Build app and Finder extension
        run: >-
          xcodebuild -project AetherZip.xcodeproj -scheme AetherZip
          -configuration Release -derivedDataPath .build/ci
          CODE_SIGNING_ALLOWED=NO build
      - name: Remove generated artifacts
        if: always()
        run: swift package clean
